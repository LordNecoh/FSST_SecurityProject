services:
  proxy:
    build: ./proxy
    ports:
      - "8000:8000"
    volumes:
      - ./proxy:/app
    environment:
      - SERVER_HOST=server
      - SERVER_PORT=8001
    depends_on:
      - server

  server:
    build: ./server
    ports:
      - "8001:8001"
    volumes:
      - ./server:/app  